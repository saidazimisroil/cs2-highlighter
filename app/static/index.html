<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CS2 Highlights</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/demos"><span class="mark">▲</span> CS2 Highlights</a>
      <nav class="nav">
        <a href="#/demos" data-nav="demos">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM4 9h16M9 5v4"/></svg>
          Demos <span class="count" id="nav-demos"></span></a>
        <a href="#/videos" data-nav="videos">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h11v12H4zM15 10l5-3v10l-5-3"/></svg>
          Videos <span class="count" id="nav-videos"></span></a>
      </nav>
      <div class="side-title">Recent</div>
      <div id="recent" class="recent"></div>
      <div id="status" class="status"></div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <header class="topbar">
      <button class="icon-btn" id="menu" aria-label="Menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <a class="brand" href="#/demos"><span class="mark">▲</span> CS2 Highlights</a>
    </header>

    <main id="view" class="view"></main>
  </div>
  <div id="toast" class="toast" hidden></div>

  <script src="/static/app.js"></script>
</body>
</html>
